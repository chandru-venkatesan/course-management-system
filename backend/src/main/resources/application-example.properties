spring.datasource.url=jdbc:mysql://localhost:3306/course_management_system
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=YOUR_JWT_SECRET
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.org.springframework.security=INFO

# Authentication API Rate Limiting
rate.limit.requests=5
rate.limit.duration-minutes=1

# General API Rate Limiting
rate.limit.api.requests=30
rate.limit.api.duration-minutes=1